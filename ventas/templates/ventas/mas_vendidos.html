<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Productos Más Vendidos</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans p-6">
    <div class="max-w-4xl mx-auto">
        
        <div class="mb-6">
            <a href="/admin/" class="inline-block bg-gray-600 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded transition shadow-sm text-sm">
                ← Volver al Menú Principal
            </a>
        </div>

        <div class="mb-6">
            <h1 class="text-3xl font-bold text-gray-800">🏆 Productos Más Vendidos</h1>
        </div>

        <div class="bg-white p-4 rounded-lg shadow-md mb-6">
            <form method="GET" class="flex flex-wrap items-end gap-4">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Fecha Inicio</label>
                    <input type="date" name="fecha_inicio" value="{{ fecha_inicio }}" class="border border-gray-300 rounded px-3 py-2">
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Fecha Fin</label>
                    <input type="date" name="fecha_fin" value="{{ fecha_fin }}" class="border border-gray-300 rounded px-3 py-2">
                </div>
                <button type="submit" class="bg-blue-600 text-white font-bold py-2 px-6 rounded hover:bg-blue-700 transition">Filtrar</button>
                <a href="{% url 'reporte_mas_vendidos' %}" class="text-blue-500 underline mb-2">Limpiar</a>
            </form>
        </div>

        <div class="bg-white shadow-md rounded-lg overflow-hidden">
            <table class="w-full text-left">
                <thead class="bg-gray-800 text-white">
                    <tr>
                        <th class="p-3 text-center">Puesto</th>
                        <th class="p-3">Producto</th>
                        <th class="p-3 text-center">Cantidad Vendida</th>
                        <th class="p-3 text-right">Ingreso Generado</th>
                    </tr>
                </thead>
                <tbody>
                    {% for item in ranking %}
                    <tr class="border-b hover:bg-gray-50">
                        <td class="p-3 text-center font-bold text-gray-500">#{{ forloop.counter }}</td>
                        <td class="p-3 font-semibold text-gray-800">{{ item.nombre }}</td>
                        <td class="p-3 text-center font-bold text-blue-600">{{ item.cantidad }}</td>
                        <td class="p-3 text-right font-bold text-green-600">${{ item.ingreso }}</td>
                    </tr>
                    {% empty %}
                    <tr>
                        <td colspan="4" class="p-6 text-center text-gray-500">No hay ventas registradas en este periodo.</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
