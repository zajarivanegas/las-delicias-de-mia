<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block titulo %}Las delicias de Mía{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-slate-100">

  <header class="bg-white shadow-sm">
    <div class="max-w-4xl mx-auto flex items-center justify-between px-4 py-3">
      <span class="font-bold text-slate-800">Las delicias de Mía</span>

      {% if user.is_authenticated %}
        <div class="flex items-center gap-3">
          <span class="text-sm text-slate-600">
            {{ user.first_name|default:user.username }} ({{ user.get_rol_display }})
          </span>

          <form action="{% url 'logout' %}" method="post">
            {% csrf_token %}
            <button type="submit"
              class="bg-slate-800 hover:bg-slate-900 text-white text-sm font-medium rounded-lg px-3 py-1.5 transition-colors">
              Cerrar sesión
            </button>
          </form>
        </div>
      {% endif %}
    </div>
  </header>

  <main class="max-w-4xl mx-auto p-4">
    {% block contenido %}{% endblock %}
  </main>

</body>
</html>
