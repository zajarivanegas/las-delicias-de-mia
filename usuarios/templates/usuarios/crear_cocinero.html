<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cocinero</title>
    <!-- CDN Temporal de Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-white rounded-lg shadow-lg overflow-hidden">
        <!-- Encabezado del Formulario -->
        <div class="bg-red-700 p-4 text-center">
            <h2 class="text-white text-xl font-bold">Registrar Nuevo Cocinero</h2>
        </div>
        
        <!-- Formulario -->
        <div class="p-6">
            <form method="POST">
                {% csrf_token %}
                
                {% for field in form %}
                    <div class="mb-4">
                        <label class="block text-gray-700 text-sm font-bold mb-2">{{ field.label }}</label>
                        {{ field }}
                        {% if field.help_text %}
                            <p class="text-gray-500 text-xs mt-1">{{ field.help_text|safe }}</p>
                        {% endif %}
                        {% for error in field.errors %}
                            <p class="text-red-500 text-xs mt-1 font-semibold">{{ error }}</p>
                        {% endfor %}
                    </div>
                {% endfor %}

                <div class="mt-6 flex flex-col gap-3">
                    <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded transition duration-200">
                        Guardar Cocinero
                    </button>
                    <a href="{% url 'gestion_personal' %}" class="w-full text-center bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-2 px-4 rounded transition duration-200">
                        Cancelar
                    </a>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
