<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Estado de tu Pedido</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans p-6 flex justify-center items-center min-h-screen">
    <div class="bg-white p-8 rounded-xl shadow-lg max-w-md w-full">
        <h1 class="text-2xl font-bold text-center mb-6 text-gray-800">Estado del Pedido #{{ pedido.id }}</h1>

        <div class="flex justify-between mb-8 relative">
            <div class="absolute top-1/2 left-0 w-full h-1 bg-gray-200 -z-10 transform -translate-y-1/2"></div>
            
            <div class="text-center z-10">
                <div class="w-8 h-8 mx-auto rounded-full flex items-center justify-center text-white font-bold {% if pedido.estado == 'pendiente' or pedido.estado == 'preparacion' or pedido.estado == 'listo' or pedido.estado == 'entregado' %}bg-blue-500{% else %}bg-gray-300{% endif %}">1</div>
                <p class="text-xs mt-2 font-semibold">Pendiente</p>
            </div>
            
            <div class="text-center z-10">
                <div class="w-8 h-8 mx-auto rounded-full flex items-center justify-center text-white font-bold {% if pedido.estado == 'preparacion' or pedido.estado == 'listo' or pedido.estado == 'entregado' %}bg-yellow-500{% else %}bg-gray-300{% endif %}">2</div>
                <p class="text-xs mt-2 font-semibold">En Prep.</p>
            </div>

            <div class="text-center z-10">
                <div class="w-8 h-8 mx-auto rounded-full flex items-center justify-center text-white font-bold {% if pedido.estado == 'listo' or pedido.estado == 'entregado' %}bg-green-500{% else %}bg-gray-300{% endif %}">3</div>
                <p class="text-xs mt-2 font-semibold">Listo</p>
            </div>

            <div class="text-center z-10">
                <div class="w-8 h-8 mx-auto rounded-full flex items-center justify-center text-white font-bold {% if pedido.estado == 'entregado' %}bg-purple-500{% else %}bg-gray-300{% endif %}">4</div>
                <p class="text-xs mt-2 font-semibold">Entregado</p>
            </div>
        </div>

        <h3 class="text-lg font-bold mb-2 text-gray-700 border-b pb-2">Historial de tu pedido</h3>
        <ul class="space-y-2">
            {% for registro in historial %}
            <li class="flex justify-between text-sm text-gray-600">
                <span class="font-medium text-gray-800">{{ registro.estado|capfirst }}</span>
                <span>{{ registro.fecha_hora|date:"H:i:s" }}</span>
            </li>
            {% empty %}
            <li class="text-sm text-gray-500">Aún no hay cambios de estado.</li>
            {% endfor %}
        </ul>
    </div>
</body>
</html>
