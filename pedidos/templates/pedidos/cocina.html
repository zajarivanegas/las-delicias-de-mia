<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cocina - Pedidos Activos</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans p-6">
    <div class="max-w-6xl mx-auto">
        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between mb-6 gap-2">
            <h1 class="text-3xl font-bold text-gray-800">Pedidos en Cocina</h1>
            <span id="estado-conexion" class="text-sm text-gray-500 bg-white px-3 py-1 rounded-full shadow-sm">
                Actualización automática cada 5s
            </span>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="p-3 mb-4 rounded text-white {% if message.tags == 'error' %}bg-red-500{% elif message.tags == 'warning' %}bg-yellow-500{% else %}bg-green-500{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <!-- Contenedor donde JavaScript pinta los pedidos automáticamente -->
        <div id="cola-pedidos" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            <div class="col-span-full text-center py-10 bg-white rounded-lg shadow">
                <p class="text-gray-500 text-lg">Cargando pedidos...</p>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "{% url 'api_pedidos_cocina' %}";
        const contenedor = document.getElementById("cola-pedidos");

        function obtenerEstilosEstado(estado) {
            if (estado === "pendiente") {
                return {
                    borde: "border-red-500",
                    badge: "bg-red-100 text-red-700"
                };
            }
            if (estado === "en_preparacion") {
                return {
                    borde: "border-yellow-500",
                    badge: "bg-yellow-100 text-yellow-700"
                };
            }
            return {
                borde: "border-gray-400",
                badge: "bg-gray-100 text-gray-700"
            };
        }

        function renderizarPedidos(pedidos) {
            if (!pedidos || pedidos.length === 0) {
                contenedor.innerHTML = `
                    <div class="col-span-full text-center py-10 bg-white rounded-lg shadow">
                        <p class="text-gray-500 text-lg">No hay pedidos activos en este momento.</p>
                    </div>
                `;
                return;
            }

            contenedor.innerHTML = pedidos.map(pedido => {
                const estilos = obtenerEstilosEstado(pedido.estado);
                const destino = pedido.mesa ? `Mesa #${pedido.mesa}` : pedido.tipo_pedido;
                const listaProductos = pedido.detalles.map(d => `
                    <li class="flex justify-between text-sm text-gray-700 py-1 border-b border-gray-100 last:border-b-0">
                        <span>${d.producto}</span>
                        <span class="font-semibold">x${d.cantidad}</span>
                    </li>
                `).join("");

                return `
                    <div class="bg-white rounded-lg shadow-md p-4 border-l-4 ${estilos.borde}">
                        <div class="flex justify-between items-center mb-2">
                            <h2 class="text-xl font-bold text-gray-800">Pedido #${pedido.id}</h2>
                            <span class="px-2 py-1 text-xs font-bold rounded-full ${estilos.badge}">
                                ${pedido.estado_display}
                            </span>
                        </div>

                        <div class="flex justify-between text-sm text-gray-500 mb-3">
                            <span><strong>${destino}</strong></span>
                            <span>Llegó: ${pedido.hora}</span>
                        </div>

                        <ul class="bg-gray-50 rounded p-2">
                            ${listaProductos || '<li class="text-sm text-gray-400">Sin productos</li>'}
                        </ul>
                    </div>
                `;
            }).join("");
        }

        async function cargarPedidos() {
            try {
                const respuesta = await fetch(API_URL, {
                    headers: { "X-Requested-With": "XMLHttpRequest" }
                });
                if (!respuesta.ok) return;
                const datos = await respuesta.json();
                renderizarPedidos(datos.pedidos);
            } catch (error) {
                console.error("Error al actualizar pedidos:", error);
            }
        }

        // Carga inmediata al abrir la página y luego cada 5 segundos
        cargarPedidos();
        setInterval(cargarPedidos, 5000);
    </script>
</body>
</html>
